name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish under (leave empty to use the commit-derived tag)'
        required: false
        type: string

env:
  BUILD_TYPE: RelWithDebInfo

jobs:
  build-windows:
    name: Windows (${{ matrix.flavour }})
    runs-on: windows-latest
    if: ${{ vars.APK_ONLY == '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows
            flavour: vs
            dir: build-windows
          - preset: windows-ninja
            flavour: ninja
            dir: build-windows-ninja

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    # The `windows` preset targets the Visual Studio 2022 generator. Pick the generator
    # of the Visual Studio installation that is actually installed so the job keeps
    # working on newer runners (VS 2026) as well.
    - name: Select Visual Studio generator
      id: vs
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        if (-not (Test-Path $vswhere)) { throw 'vswhere.exe not found' }
        $version = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion) | Select-Object -First 1
        if (-not $version) { throw 'No Visual Studio installation with the C++ toolset found' }
        $major = [int]($version.Split('.')[0])
        $generator = switch ($major) {
          17 { 'Visual Studio 17 2022' }
          18 { 'Visual Studio 18 2026' }
          default { throw "Unsupported Visual Studio version $version" }
        }
        Write-Host "Visual Studio $version -> $generator"
        "generator=$generator" >> $env:GITHUB_OUTPUT

    # The Ninja preset needs the MSVC environment; the Visual Studio preset does not.
    - name: Set up MSVC environment
      if: matrix.flavour == 'ninja'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.4.304.0
        cache: true

    # Monado and WiVRn compile GLSL at build time and need glslangValidator, which
    # ships with the Vulkan SDK.
    - name: Add Vulkan SDK tools to PATH
      shell: pwsh
      run: |
        $bin = Join-Path $env:VULKAN_SDK 'Bin'
        if (-not (Test-Path (Join-Path $bin 'glslangValidator.exe'))) {
          throw "glslangValidator.exe not found in $bin"
        }
        $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - uses: actions/cache@v5
      with:
        key: windows-deps-${{ matrix.flavour }}-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', 'monado-rev', 'patches/**') }}
        # Only the downloaded archives are cached: the source trees carry applied
        # patches, so restoring them would re-run the patch step on a patched tree.
        path: |
          ${{github.workspace}}/${{ matrix.dir }}/_deps/*-subbuild/*-populate-prefix/src/*.tar.*
          ${{github.workspace}}/${{ matrix.dir }}/_deps/*-subbuild/*-populate-prefix/src/*.zip
        restore-keys: windows-deps-${{ matrix.flavour }}-

    - uses: actions/cache@v5
      with:
        key: vcpkg-binary-${{ hashFiles('vcpkg.json') }}
        path: ${{github.workspace}}/vcpkg-cache
        restore-keys: vcpkg-binary-

    - name: Configure
      shell: pwsh
      run: |
        # The MSVC environment exports VCPKG_ROOT pointing at the vcpkg bundled
        # with Visual Studio. That copy has no git metadata, so it rejects the
        # manifest with "requires a manifest with a specified baseline". Prefer
        # the runner's own vcpkg checkout, which is a full git clone.
        if ($env:VCPKG_INSTALLATION_ROOT) {
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
        } elseif (-not $env:VCPKG_ROOT) {
          throw 'Set VCPKG_ROOT to a vcpkg checkout'
        }
        $env:VCPKG_BINARY_SOURCES = "clear;files,$env:GITHUB_WORKSPACE/vcpkg-cache,readwrite"
        "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
        "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES" >> $env:GITHUB_ENV

        $preset = '${{ matrix.preset }}'
        if ($preset -eq 'windows') {
          cmake --preset $preset -G '${{ steps.vs.outputs.generator }}'
        } else {
          cmake --preset $preset
        }
        exit $LASTEXITCODE

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Stage install
      run: cmake --install ${{ matrix.dir }} --config ${{ env.BUILD_TYPE }} --prefix stage-${{ matrix.flavour }}

    - name: Upload server
      uses: actions/upload-artifact@v7
      with:
        name: wivrn-server-windows-${{ matrix.flavour }}
        path: stage-${{ matrix.flavour }}/*
        retention-days: 30

    - name: Ensure NSIS
      if: matrix.flavour == 'vs'
      shell: pwsh
      run: |
        $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
        if (-not (Test-Path $makensis)) {
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install NSIS' }
        }

    - name: Package
      if: matrix.flavour == 'vs'
      run: cpack --preset windows

    - name: Upload installer
      if: matrix.flavour == 'vs'
      uses: actions/upload-artifact@v7
      with:
        name: wivrn-installer-windows
        path: build-windows/package/*.exe
        retention-days: 30

    - name: Upload build dir
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: windows-build-dir-${{ matrix.flavour }}
        path: |
          ${{ matrix.dir }}/CMakeFiles/CMakeConfigureLog.yaml
          ${{ matrix.dir }}/CMakeCache.txt
        retention-days: 3

  build-android:
    name: Android
    runs-on: ubuntu-24.04
    if: ${{ vars.APK_ONLY == '' }}

    strategy:
      matrix:
        buildtype: ['Release', 'Debug', 'DebugWithValidationLayer']

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/cache@v5
      with:
        key: cmake-android-${{matrix.buildtype}}
        path: |
          ${{github.workspace}}/cmake-fetch/*-subbuild/*-populate-prefix/src/*.tar.*
          ${{github.workspace}}/cmake-fetch/*-subbuild/*-populate-prefix/src/*.zip
          ${{github.workspace}}/cmake-fetch/*.tar.*
          ${{github.workspace}}/cmake-fetch/*.zip
          ${{github.workspace}}/cmake-fetch/*.tgz
        restore-keys: cmake-android-

    # Gradle distribution and the Android plugin's dependencies.
    - uses: actions/cache@v5
      with:
        key: gradle-android-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle') }}
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        restore-keys: gradle-android-

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install glslang-tools spirv-tools librsvg2-bin gettext
        # gltf-transform needs KTX-Software 4.4 or newer (it uses --assign-tf,
        # which 4.3 lacks), and 4.4.2 is the version libktx is built from.
        wget https://github.com/KhronosGroup/KTX-Software/releases/download/v4.4.2/KTX-Software-4.4.2-Linux-x86_64.deb
        sudo dpkg --install KTX-Software-4.4.2-Linux-x86_64.deb
        npm install --global @gltf-transform/cli

    - name: Check for Secret availability
      id: secret-check
      shell: bash
      run: |
        if [[ "${{ secrets.APK_SIGNINGKEYPASSWORD }}" != '' && "${{ secrets.APK_KEYSTORE_BASE64 }}" != '' ]]; then
          echo "available=true" >> $GITHUB_OUTPUT;
        else
          echo "available=false" >> $GITHUB_OUTPUT;
        fi

    - name: Secrets
      if: ${{ steps.secret-check.outputs.available == 'true' }}
      env:
        APK_SIGNINGKEYPASSWORD: ${{ secrets.APK_SIGNINGKEYPASSWORD }}
        APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
      run: |
        echo signingKeyPassword="$APK_SIGNINGKEYPASSWORD" > gradle.properties
        echo "$APK_KEYSTORE_BASE64" | base64 --decode --ignore-garbage > ks.keystore

    - name: Build
      run: |
        VERSION=$(git describe --tags --always | sed "s/^v\([0-9]\)/\1/")
        VERSION_CODE=1

        if [ ${{ github.ref_type }} = 'tag' ]
        then
              SUFFIX=".github"
              APPNAME="WiVRn"
        else
              SUFFIX=".github.testing"
              APPNAME="WiVRn Testing"
        fi

        if [ ${{ github.ref_type }} = 'tag' ]
        then
          CSS=images/wivrn-release.css
        else
          CSS=images/wivrn-nightly.css
        fi

        echo Setting version $VERSION and version code $VERSION_CODE in manifest
        echo Using stylesheet $CSS and name $APPNAME

        chmod +x gradlew
        ./gradlew \
          -Pwivrn_version=$VERSION \
          -Pwivrn_versionCode=$VERSION_CODE \
          -Psuffix=$SUFFIX \
          -Pwivrn_css=$CSS \
          -Pwivrn_app_name="$APPNAME" \
          -Pwivrn_compress_glb=ON \
          -Pfetchcontent_base_dir=${{github.workspace}}/cmake-fetch \
          assemble${{ matrix.buildtype }}

    - name: Upload build dir
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: android-cxx-debug-${{ matrix.buildtype }}
        path: .cxx
        include-hidden-files: true
        retention-days: 1

    - name: Prepare before archiving artifacts
      run: |
        mkdir apk
        mv $(find build/outputs/apk/ -name "*.apk") apk/
        mkdir debug
        mv build/intermediates/merged_native_libs/*/*/out/lib/* debug/
        find debug -name libopenxr_loader.so -delete

    - name: Archive APK
      uses: actions/upload-artifact@v7
      with:
        name: apk-${{ (steps.secret-check.outputs.available == 'false' && matrix.buildtype == 'Release') && 'Release-unsigned' || matrix.buildtype }}
        path: apk/*.apk
        retention-days: 30

    - name: Archive debug symbols
      uses: actions/upload-artifact@v7
      with:
        name: symbols-${{ matrix.buildtype }}
        path: debug/**/*.so

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: [build-windows, build-android]
    permissions:
      # Publishing a release needs a write-scoped token; the default token can be
      # read-only depending on the repository settings.
      contents: write
    # Tag pushes publish under their tag, pushes to master publish a build named
    # after the commit, and a manual run may name the tag itself. Pull requests
    # and feature branch pushes only build.
    if: >-
      success() && (
        startsWith(github.ref, 'refs/tags/') ||
        github.ref == 'refs/heads/master' ||
        (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
      )

    steps:
    - uses: actions/checkout@v6
      with:
        # git describe needs the tags to name a build that has no tag yet.
        fetch-depth: 0

    - name: Determine release tag
      id: tag
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        if [ -n "${RELEASE_TAG}" ]; then
          tag="${RELEASE_TAG}"
        elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          tag="${GITHUB_REF_NAME}"
        else
          # v26.9-41-gf21cd916 for example: unique per commit so every master
          # build is a release of its own instead of overwriting the last one.
          tag="v$(git describe --tags --always | sed 's/^v//')"
        fi
        echo "Publishing $tag"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"

    - name: Download artifacts (APK)
      uses: actions/download-artifact@v8
      with:
        # apk-Release when the signing secrets are set, apk-Release-unsigned otherwise.
        pattern: apk-*
        path: apk
        merge-multiple: true

    - name: Download artifacts (installer)
      uses: actions/download-artifact@v8
      with:
        name: wivrn-installer-windows
        path: installer

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        # Pin the tag to the commit that was built, not to whatever the branch
        # points at when the release is published.
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        draft: false
        prerelease: false
        make_latest: true
        files: |
          apk/*.apk
          installer/*.exe

  sync_fork_downstream:
    name: Sync fork downstream
    runs-on: ubuntu-24.04
    needs: [build-android]
    if: ${{ vars.APK_ONLY == '' && github.ref == 'refs/heads/master' }}
    steps:
      - name: Check for DOWNSTREAM_GITHUB_TOKEN
        id: downstream-secret-check
        shell: bash
        run: |
          if [[ "${{ secrets.DOWNSTREAM_GITHUB_TOKEN }}" != '' ]]; then
            echo "available=true" >> $GITHUB_OUTPUT;
          else
            echo "available=false" >> $GITHUB_OUTPUT;
          fi
      - name: Sync fork downstream
        if: ${{ steps.downstream-secret-check.outputs.available == 'true' }}
        run: |
          curl -X POST -H "Accept: application/vnd.github.v3+json" \
               -H "Authorization: token ${{ secrets.DOWNSTREAM_GITHUB_TOKEN }}" \
               https://api.github.com/repos/WiVRn/WiVRn-APK/merge-upstream \
               -d '{"branch":"master"}'
